name: Dependency audit

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failed_steps: ${{ steps.summary.outputs.failed_steps }}
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: false

      # Audit the committed lockfile, including dev and optional dependencies,
      # without installing packages or running dependency lifecycle scripts.
      - name: Audit dependencies
        id: audit
        run: pnpm audit --audit-level low

      - name: Summarize audit result
        id: summary
        if: ${{ always() }}
        uses: actions/github-script@v8
        env:
          CHECK_STEPS: ${{ toJSON(steps) }}
        with:
          script: |
            const steps = Object.entries(JSON.parse(process.env.CHECK_STEPS));
            const failed = steps.filter(([, step]) => step.outcome === 'failure').map(([name]) => name);
            core.setOutput('failed_steps', failed.join(', '));
            await core.summary
              .addHeading('Dependency audit')
              .addTable([
                [{ data: 'Step', header: true }, { data: 'Result', header: true }],
                ...steps.map(([name, step]) => [name, step.outcome]),
              ])
              .write();

  report:
    needs: audit
    # Branch experiments and cancelled runs must not alter the default-branch incident.
    if: >-
      ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && (needs.audit.result == 'success' || needs.audit.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # No checkout or dependency code runs with the issue-writing token.
      - name: Report failure or recovery
        uses: actions/github-script@v8
        env:
          CHECK_RESULT: ${{ needs.audit.result }}
          FAILED_STEPS: ${{ needs.audit.outputs.failed_steps }}
        with:
          script: |
            const marker = '<!-- dsh-autoresearch-dependency-audit -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.body?.includes(marker));
            if (process.env.CHECK_RESULT === 'success') {
              if (issue) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number,
                  body: `Dependency audit recovered. [Passing run](${run}).`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
                core.notice(`Closed recovered dependency audit incident #${issue.number}`);
              }
              return;
            }

            const failed = process.env.FAILED_STEPS || 'setup, runner, or summary; see run log';
            const key = `<!-- audit-failure: ${failed} -->`;
            const body = [
              marker, key,
              `@${context.repo.owner} the dependency audit failed.`,
              '',
              `Failed steps: **${failed}**.`,
              `[Workflow logs](${run}).`,
              '',
              'This check runs `pnpm audit --audit-level low` against the committed lockfile, including dev and optional dependencies, without installing packages or running dependency lifecycle scripts.',
              'A failure may indicate reported vulnerabilities, registry/network errors, or setup/runner failures. Inspect the failed step before treating it as a confirmed vulnerability.',
              'Re-run **Dependency audit** from Actions on the default branch to check recovery.',
              '',
              'Repeated failures at the same steps update this issue without new comments. Changed failed steps add a notification; a passing default-branch check closes the issue.',
            ].join('\n');
            if (issue) {
              if (!issue.body.includes(key)) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number,
                  body: `@${context.repo.owner} the dependency audit failure changed; failed steps: **${failed}**. [Run](${run}).`,
                });
              }
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
              core.notice(`Updated dependency audit incident #${issue.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo, title: 'Dependency audit failed', body,
              });
              core.notice(`Created dependency audit incident #${created.number}`);
            }
