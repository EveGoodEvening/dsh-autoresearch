allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
# Delay new dependency resolutions by seven days (value is in minutes).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # DSH publishes one synchronized prerelease family; exact versions remain locked in pnpm-lock.yaml.
  - '@deepseek-ai/*'
