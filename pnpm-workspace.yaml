allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
# Delay new dependency resolutions by seven days (value is in minutes).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # DSH publishes one synchronized prerelease family; exact versions remain locked in pnpm-lock.yaml.
  - '@deepseek-ai/*'
# Exact-version overrides. Unless noted, upstream Host/tooling pins still resolve these vulnerable versions.
overrides:
  # Works around dsh-otel's exact OTel SDK 2.11.0/0.222.0 peers (<1.10.0) vs its
  # own ^1.9.1 api range. Not a security fix; remove once upstream aligns.
  '@opentelemetry/api@1.10.0': 1.9.1
  '@modelcontextprotocol/client@2.2.0': 2.3.0
  'fflate@0.8.2': 0.8.3
  'undici@8.11.2': 8.12.2
  'zod@4.4.3': 4.6.7
